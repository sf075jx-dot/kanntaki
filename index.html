<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>利用料金シミュレーション</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <img id="app-logo" src="" alt="ロゴ" style="height: 36px; margin-right: 14px; object-fit: contain; display: none;" onerror="this.style.display='none';">
                <h1 id="header-title">利用料金シミュレーション</h1>
            </div>
            <div>
                <button class="btn btn-secondary" onclick="resetForm()">初期条件にリセット</button>
            </div>
        </header>

        <div class="main-content">
            <!-- 左側：入力パネル -->
            <div class="panel input-panel" id="input-panel-container">
                <!-- 編集中のみ表示されるステータスバー -->
                <div id="editing-banner" class="editing-banner" style="display: none;">
                    <span id="editing-banner-text">✏️ プランを編集中</span>
                    <button type="button" class="editing-cancel-link" onclick="cancelEdit()">キャンセル</button>
                </div>

                <div class="input-scroll-area">
                    
                    <!-- 1. 介護度選択 -->
                    <div class="accordion-header" onclick="toggleAccordion('care-section', this)">
                        <h2><span class="step-num">1</span> 介護度選択 <span class="required">必須</span></h2>
                        <span class="accordion-icon open">▼</span>
                    </div>
                    <div id="care-section" class="accordion-content">
                        <div id="care-level-container" class="care-buttons-group">
                            <!-- 動的生成 -->
                        </div>
                    </div>

                    <!-- 2. 負担割合選択 -->
                    <div class="accordion-header" onclick="toggleAccordion('burden-section', this)">
                        <h2><span class="step-num">2</span> 負担割合 <span class="required">必須</span></h2>
                        <span class="accordion-icon open">▼</span>
                    </div>
                    <div id="burden-section" class="accordion-content">
                        <div id="burden-ratio-container" class="burden-buttons-group">
                            <!-- 動的生成 -->
                        </div>
                    </div>

                    <!-- 3. 加算項目選択 -->
                    <div class="accordion-header" onclick="toggleAccordion('additions-section', this)">
                        <h2><span class="step-num">3</span> 各種加算項目 <span id="additions-badge" class="accordion-badge">選択: 0件</span></h2>
                        <span class="accordion-icon open">▼</span>
                    </div>
                    <div id="additions-section" class="accordion-content">
                        <div id="additions-container" class="addition-buttons-group">
                            <!-- 動的生成 -->
                        </div>
                    </div>

                    <!-- 4. オプション選択 -->
                    <div class="accordion-header" onclick="toggleAccordion('options-section', this)">
                        <h2><span class="step-num">4</span> 自費・オプション <span id="options-badge" class="accordion-badge">選択: 0件</span></h2>
                        <span class="accordion-icon open">▼</span>
                    </div>
                    <div id="options-section" class="accordion-content">
                        <div id="options-container" class="options-list">
                            <!-- 動的生成 -->
                        </div>
                    </div>

                </div>

                <div class="action-buttons">
                    <button id="submit-plan-btn" class="btn btn-primary" onclick="saveOrAddComparison()">＋ 比較プランに追加する</button>
                    <button id="cancel-edit-btn" class="btn btn-outline" style="display: none; margin-top: 8px; width: 100%;" onclick="cancelEdit()">編集をキャンセルして新規作成へ</button>
                </div>
            </div>

            <!-- 右側：シミュレーション結果カード比較エリア -->
            <div class="panel results-panel">
                <div id="comparison-cards" class="cards-container">
                    <div class="empty-state">
                        <div class="empty-title">シミュレーション結果がここに表示されます</div>
                        <div class="empty-desc">左側のパネルで条件を選択し、「比較プランに追加する」を押してください。<br>（最大3つのプランを並べて比較・後から編集できます）</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 画面右下にひっそり佇む隠し管理者ボタン（歯車） -->
    <button class="stealth-admin-btn" onclick="openAdminAuth()" title="管理者設定">⚙️</button>

    <!-- 管理者認証モーダル -->
    <div id="auth-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="width: 340px;">
            <h3 class="modal-title">管理者パスワード認証</h3>
            <p class="modal-desc">設定を変更するにはパスワードを入力してください。</p>
            <input type="password" id="admin-pass-input" class="form-input" placeholder="パスワードを入力" style="margin-bottom: 18px;">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeAuthModal()">キャンセル</button>
                <button class="btn btn-primary" style="width:auto; padding:10px 20px;" onclick="verifyAdmin()">認証する</button>
            </div>
        </div>
    </div>

    <!-- 設定編集モーダル -->
    <div id="config-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="width: 720px; max-height: 90vh; overflow-y: auto;">
            <h3 class="modal-title" style="border-bottom: 2px solid var(--tiffany-base); padding-bottom: 10px; margin-bottom: 18px;">システム設定管理</h3>
            
            <div class="form-group">
                <label class="form-label">施設名</label>
                <input type="text" id="edit-facility-name" class="form-input">
            </div>

            <!-- ロゴ設定エリア -->
            <div class="form-group">
                <label class="form-label">会社・施設ロゴ画像</label>
                <div style="display:flex; align-items:center; gap:12px; flex-wrap: wrap;">
                    <img id="edit-logo-preview" src="" alt="ロゴプレビュー" style="height: 40px; max-width: 140px; object-fit: contain; border: 1px solid var(--border-color); border-radius: 6px; display: none; background: #fff; padding: 4px;">
                    <input type="file" id="edit-logo-file" accept="image/png, image/jpeg, image/jpg" onchange="previewLogoFile(event)" style="font-size: 12px;">
                    <button type="button" class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="removeLogo()">ロゴを削除</button>
                </div>
            </div>

            <!-- 1単位あたりの単価設定 -->
            <div class="form-group">
                <label class="form-label">1単位あたりの単価 (円)</label>
                <input type="number" step="0.01" id="edit-unit-price-per-unit" class="form-input" placeholder="例: 10.14">
                <span class="form-help">※地域区分や人件費割合に応じた単価を設定してください。</span>
            </div>

            <div class="form-group">
                <label class="form-label">管理者パスワード変更</label>
                <input type="text" id="edit-admin-password" class="form-input" placeholder="変更する場合のみ新しいパスワードを入力">
                <span class="form-help">※空欄のままにすると現在のパスワードが維持されます。</span>
            </div>

            <!-- 負担割合設定 -->
            <div class="form-group">
                <label class="form-label">負担割合マスタ</label>
                <div id="edit-burden-ratios-container" style="display:flex; flex-direction:column; gap:6px;"></div>
            </div>

            <!-- 介護度設定 -->
            <div class="form-group">
                <label class="form-label">介護度・基本料金マスタ (単位数)</label>
                <div id="edit-care-levels-container" style="display:flex; flex-direction:column; gap:6px;"></div>
            </div>

            <!-- 加算項目設定 -->
            <div class="form-group">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <label class="form-label" style="margin-bottom:0;">加算項目マスタ（単位数・％、ドラッグで並び替え可）</label>
                    <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="addAdditionRow()">＋ 行を追加</button>
                </div>
                <div id="edit-additions-container" style="display:flex; flex-direction:column; gap:6px;"></div>
            </div>

            <!-- オプション設定 -->
            <div class="form-group" style="margin-bottom:24px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <label class="form-label" style="margin-bottom:0;">オプション項目マスタ（ドラッグで並び替え可）</label>
                    <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="addOptionRow()">＋ 行を追加</button>
                </div>
                <div id="edit-options-container" style="display:flex; flex-direction:column; gap:6px;"></div>
            </div>

            <div class="modal-actions" style="border-top:1px solid #edf2f7; padding-top:16px;">
                <button class="btn btn-secondary" onclick="closeConfigModal()">キャンセル</button>
                <button class="btn btn-primary" style="width:auto; padding:10px 24px;" onclick="saveNewConfig()">保存して適用</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
